name: Alpha read-only preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: 15.164.111.216
      DEPLOY_USER: eunchang
    steps:
      - name: Set up existing alpha SSH authentication
        env:
          ALPHA_SSH_KEY: ${{ secrets.ALPHA_SSH_KEY }}
          ALPHA_KNOWN_HOSTS: ${{ secrets.ALPHA_KNOWN_HOSTS }}
        run: |
          set +x
          test -n "$ALPHA_SSH_KEY"
          test -n "$ALPHA_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$ALPHA_SSH_KEY" > ~/.ssh/id_alpha_preflight
          chmod 600 ~/.ssh/id_alpha_preflight
          printf '%s\n' "$ALPHA_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Inspect version, process and whitelisted settings only
        run: |
          ssh -i ~/.ssh/id_alpha_preflight -o BatchMode=yes -o ConnectTimeout=8 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          unit=clickmoney-alpha
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          systemctl show "$unit" -p ActiveState -p SubState -p MainPID -p User -p FragmentPath -p EnvironmentFiles
          printf 'CURRENT_RELEASE='
          readlink -f /opt/ttalkkak/current || true
          if [ -f /opt/ttalkkak/current/app.jar ]; then sha256sum /opt/ttalkkak/current/app.jar; fi
          free -m
          printf 'JAVA_PROCESS_COUNT='
          pgrep -cx java || true
          pid=$(systemctl show "$unit" -p MainPID --value)
          if command -v python3 >/dev/null && [ "${pid:-0}" -gt 0 ]; then
            python3 - "$pid" <<'PY'
          import pathlib, sys
          allowed = {'SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE', 'SPRING_TASK_SCHEDULING_POOL_SIZE',
                     'SPRING_JPA_HIBERNATE_DDL_AUTO', 'SPRING_CONFIG_LOCATION', 'SPRING_CONFIG_ADDITIONAL_LOCATION'}
          settings = {'spring.datasource.hikari.maximum-pool-size', 'spring.task.scheduling.pool.size',
                      'spring.jpa.hibernate.ddl-auto', 'spring.config.location', 'spring.config.additional-location'}
          pid = sys.argv[1]
          try:
              raw = pathlib.Path('/proc', pid, 'environ').read_bytes()
              for part in raw.split(b'\0'):
                  key, _, value = part.decode(errors='replace').partition('=')
                  if key in allowed:
                      safe = '[configured; location withheld]' if key.endswith('_LOCATION') else value
                      print('ENV ' + key + '=' + safe)
              for raw_arg in pathlib.Path('/proc', pid, 'cmdline').read_bytes().split(b'\0'):
                  arg = raw_arg.decode(errors='replace')
                  for prefix in ('--', '-D'):
                      if arg.startswith(prefix) and arg[len(prefix):].partition('=')[0] in settings:
                          key = arg[len(prefix):].partition('=')[0]
                          print('ARG ' + (prefix + key + '=[configured; location withheld]' if key.startswith('spring.config.') else arg))
          except (PermissionError, FileNotFoundError) as error:
              print('PROCESS_SETTINGS_UNAVAILABLE=' + type(error).__name__)
          PY
          else
            printf 'PROCESS_SETTINGS_UNAVAILABLE=no-python-or-running-pid\n'
          fi
          REMOTE
      - name: Remove runner-only SSH key
        if: always()
        run: rm -f ~/.ssh/id_alpha_preflight
