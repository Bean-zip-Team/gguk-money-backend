# /etc/nginx/conf.d/clickmoney.conf
#
# blue-green 을 위해 두 곳을 손봤다.
#   1) 맨 위에서 upstream 파일을 include 한다
#   2) proxy_pass 가 고정 포트가 아니라 upstream 이름을 가리킨다
#
# upstream 파일(~/clickmoney/nginx/upstream.conf)은 minjae 소유다.
# nginx master 는 root 로 설정을 읽으므로 홈 디렉토리에 둬도 되고,
# 덕분에 switch.sh 가 전환할 때마다 root 쓰기가 필요 없다.
#
# ssl_* 지시자는 certbot 이 관리한다. 인증서 갱신 시 이 파일이 다시 쓰일 수 있으므로,
# 갱신 후에는 include 와 proxy_pass 두 줄이 살아있는지 확인할 것.
#
# 반영:
#   sudo cp scripts/infra/nginx-clickmoney.conf /etc/nginx/conf.d/clickmoney.conf
#   sudo nginx -t && sudo nginx -s reload      # reload 는 무중단이다

include /home/minjae/clickmoney/nginx/upstream.conf;

server {
    server_name api-clickmoney.compounding.co.kr;

    location / {
        proxy_pass http://clickmoney;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api-clickmoney.compounding.co.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api-clickmoney.compounding.co.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = api-clickmoney.compounding.co.kr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api-clickmoney.compounding.co.kr;
    return 404; # managed by Certbot

}
