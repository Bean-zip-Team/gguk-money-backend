# /etc/systemd/zram-generator.conf
#
# blue-green 전환 중 겹치는 두 JVM(각 340~375MB)이 913MB 박스에 함께 올라간다.
# 부족분은 swap 으로 밀리는데, 그 swap 이 어디냐가 전부를 가른다.
#
#   /swapfile (EBS)     밀린 페이지 되읽기 → full GC 19,669ms 정지
#   /dev/zram0 (압축 RAM) 같은 상황 → 1,021ms
#
# 둘 다 운영 서버에서 jcmd GC.run 으로 직접 측정한 값이다.
# 이 설정이 없으면 switch.sh 가 전환을 거부한다.

[zram0]
zram-size = 512
compression-algorithm = lzo-rle
swap-priority = 100
