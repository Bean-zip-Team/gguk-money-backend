<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="${title} + ' · ' + ${env}">config</title>
    <style>
        :root { --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --bg:#fff; --soft:#f6f8fa; --alpha:#1a7f37; --prod:#cf222e; }
        * { box-sizing: border-box; }
        body { margin:0; font:14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; color:var(--fg); background:var(--bg); }
        header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }
        header a { color:inherit; text-decoration:none; font-weight:600; }
        .env { padding:2px 10px; border-radius:999px; color:#fff; font-weight:700; font-size:12px; }
        .env.ALPHA { background:var(--alpha); } .env.PRODUCTION { background:var(--prod); }
        header form { margin-left:auto; }
        main { max-width:960px; margin:0 auto; padding:16px; }
        table { width:100%; border-collapse:collapse; }
        th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
        th { color:var(--muted); font-weight:600; font-size:12px; }
        td.value, pre { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; word-break:break-all; white-space:pre-wrap; margin:0; }
        .muted { color:var(--muted); font-size:12px; }
        label { display:block; margin:12px 0 4px; font-weight:600; }
        input, textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
        textarea { font-family:ui-monospace, Menlo, monospace; min-height:80px; }
        button { padding:8px 16px; border:1px solid var(--line); border-radius:6px; background:var(--soft); font:inherit; cursor:pointer; }
        button.primary { background:var(--fg); color:#fff; border-color:var(--fg); }
        .error { padding:8px 12px; border-radius:6px; background:#ffebe9; color:var(--prod); margin:12px 0; }
        .box { padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--soft); margin:12px 0; }
        .scroll { overflow-x:auto; }
    </style>
</head>
<body>
<header th:fragment="header">
    <a th:href="@{/ops/config}">app_config</a>
    <span class="env" th:classappend="${env}" th:text="${env}">ENV</span>
    <form method="post" th:action="@{/ops/logout}"><button type="submit">로그아웃</button></form>
</header>
</body>
</html>
