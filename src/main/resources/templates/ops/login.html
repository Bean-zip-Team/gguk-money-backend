<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{ops/fragments :: head('로그인')}"></head>
<body>
<main style="max-width:360px">
    <h1>app_config <span class="env" th:classappend="${env}" th:text="${env}">ENV</span></h1>
    <p class="muted">운영자 토큰(app.ops.token)으로 로그인합니다.</p>
    <div class="error" th:if="${error}" th:text="${error}">error</div>
    <form method="post" th:action="@{/ops/login}">
        <label for="token">토큰</label>
        <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
        <p><button class="primary" type="submit">로그인</button></p>
    </form>
</main>
</body>
</html>
