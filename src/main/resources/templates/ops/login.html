<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{ops/fragments :: head('로그인')}"></head>
<body>
<main class="gate-page">
    <form class="gate" method="post" th:action="@{/ops/login}">
        <span class="brand-symbol"><span></span><span></span></span>
        <h1>꾹머니 설정 <span class="env" th:classappend="${env}" th:text="${env}">ENV</span></h1>
        <p>설정 수정용 토큰으로 로그인해요.</p>
        <div class="notice error" th:if="${error}" th:text="${error}">error</div>
        <input class="field" id="token" name="token" type="password" placeholder="토큰" aria-label="토큰"
               autocomplete="current-password" required autofocus>
        <button class="primary-button" type="submit">로그인</button>
    </form>
</main>
</body>
</html>
